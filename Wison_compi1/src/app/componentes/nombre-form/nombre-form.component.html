<div class="d-flex align-items-center justify-content-center">

  <div class="card w-50 m-3 shadow">
    <div class="card-body custom-card">
        <h5 class="card-title text-center mb-3">Nuevo analizador</h5>
      <form class="needs-validation" novalidate [formGroup]='nombreForm' (submit)="crear()">
        
        <div class="position-relative"
            [ngClass]="{'mb-5' : esNombreInvalido(),
            'mb-3' : esNombreValido()
          }"
          >
          <label for="validationTooltip01" class="form-label">Nombre</label>
          <input
            type="text"
            class="form-control"
            id="validationTooltip01"
            formControlName="nombre"
            [ngClass]="{'is-invalid' : esNombreInvalido(),
                'is-valid' : esNombreValido()
             }"
            required
            />
          <div class="invalid-tooltip">
            @if(esNombreInvalido()) {
                Ingrese un nombre valido
            }
          </div>
        </div>
        <br/>

        <div class="mb-3 d-flex justify-content-center">
          <button class="custom-button" type="submit">Crear analizador</button>
        </div>
      </form>
    </div>
  </div>
</div>
