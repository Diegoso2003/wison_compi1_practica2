<app-informacion></app-informacion>
@if(!arbol){
    <div class="d-flex align-items-center justify-content-center py-2 mt-2">
        <div class="card w-75 shadow-lg border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="card-title text-center mb-0">
                    <i class="bi bi-code-square me-2"></i>
                    Construcción árbol AST
                </h5>
            </div>
    
    <div class="card-body bg-dark p-4">
      <form class="needs-validation" novalidate [formGroup]="entradaForm">

        <div class="mb-4">
          <label for="codigoAnalizador" class="form-label text-light fw-semibold fs-6">
            <i class="bi bi-code-slash me-2"></i>
            Entrada a analizar
          </label>
          <div class="position-relative">
            <textarea
              #codeEditor
              class="form-control bg-dark border-secondary font-monospace fw-medium"
              id="codigoAnalizador"
              placeholder="// Escribe tu entada aquí..."
              rows="13"
              formControlName="entrada"
              [ngClass]="{
                'is-invalid border-danger': esEntradaInvalida(),
                'is-valid border-success': esEntradaValida()
              }"
              style="font-size: 1rem; line-height: 1.8; resize: vertical; padding: 1.2rem; letter-spacing: 0.5px;"
              required
            ></textarea>

            <!-- Barra de estado mejorada -->
            <div class="d-flex justify-content-between align-items-center bg-black bg-opacity-50 p-3 text-light border border-secondary border-top-0 rounded-bottom">
              <div class="fs-6">
                <span class="me-4">
                  <i class="bi bi-arrow-return-left me-2"></i>
                  <strong>Línea:</strong> {{ lineaActual }}
                </span>
                <span>
                  <i class="bi bi-arrow-right me-2"></i>
                  <strong>Columna:</strong> {{ columnaActual }}
                </span>
              </div>
            </div>

            <div class="invalid-feedback fs-6">
              @if(esEntradaInvalida()) {
                <i class="bi bi-exclamation-triangle me-1"></i>
                Ingrese una entrada válida
              }
            </div>
          </div>
        </div>

        <div class="d-grid gap-2 col-md-6 mx-auto mt-5">
          <button 
            class="btn btn-primary btn-lg py-3" 
            type="button" 
            (click)="analizar()"
            [disabled]="!entradaForm.valid">
            <i class="bi bi-play-circle me-2"></i>
            <span class="fs-5">Analizar entrada</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
} @else {
  <div class="d-flex flex-column align-items-center">
  <!-- Botón centrado -->
  <div class="mb-4">
    <button class="btn btn-primary" (click)="volver()">
      <i class="bi bi-arrow-left me-2"></i>
      Volver
    </button>
  </div>
  
  <!-- SVG centrado -->
  <div [innerHTML]="svgContent"></div>
</div>
}
